<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso a la base de datos</title>
  <link rel="stylesheet" href="estilos.css" />

</head>
<body>
  <div class="contenedor">
    <h1 id="ongiEtorri">Borra tus datos</h1>
    <p>Introduce tu correo Gmail y contraseña para eliminar tu información en la base de datos.</p>

    <form class="login-form" action="borrar.php" method="post">
      <label for="correo">Correo Gmail:</label>
      <input type="email" id="correo" name="correo" required />

      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena" name="contrasena" required />

      <button type="submit">Borrar</button>
    </form>

    <hr>

    <a href="eleccion.html"><button id="boton">Volver</button></a>
  </div>
</body>
